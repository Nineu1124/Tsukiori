<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tsukiori</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="session-rail" aria-label="Sessions">
        <div class="brand"><span class="brand-mark">月</span><strong>Tsukiori</strong></div>
        <p class="section-label">SESSIONS</p>
        <button class="session-row active" type="button">
          <span class="presence running"></span><span><strong>Local workspace</strong><small>Fake Runtime · active</small></span>
        </button>
        <div class="daemon-pill"><span class="presence" id="daemon-dot"></span><span id="status">连接 Daemon…</span></div>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <div><p class="eyebrow">SESSION / LOCAL WORKSPACE</p><h1>多 Agent 工作台</h1></div>
          <div class="workspace-meta"><span>isolated-worktree</span><span id="version">Protocol —</span></div>
        </header>

        <section id="session-timeline" class="timeline" aria-label="Session timeline">
          <article class="message-card">
            <div class="card-kicker">HOST</div>
            <h2>本地会话已准备</h2>
            <p>Runtime 工具调用、权限请求和恢复事件会在这里按时间显示。</p>
          </article>
          <section class="runtime-section" aria-label="Runtime status">
            <p class="section-label">RUNTIMES</p>
            <div id="runtime-list"></div>
          </section>
          <div id="tool-list"></div>
          <div id="permission-list"></div>
        </section>
      </main>

      <aside id="attention-center" class="attention-panel" aria-label="Attention Center">
        <header><p class="eyebrow">ATTENTION CENTER</p><h2>需要关注</h2><span id="attention-count" class="count">0</span></header>
        <nav class="attention-filters" aria-label="Attention 类型">
          <span>等待权限</span><span>等待输入</span><span>已完成</span><span>失败</span><span>冲突</span><span>恢复不确定</span>
        </nav>
        <div id="attention-list" class="attention-list">
          <p class="empty-state">暂无待处理事项</p>
        </div>
      </aside>
    </div>

    <template id="runtime-card-template">
      <article class="runtime-card">
        <div class="card-kicker">RUNTIME</div><h3 data-field="runtimeType"></h3>
        <dl>
          <div><dt>版本</dt><dd data-field="version"></dd></div>
          <div><dt>状态</dt><dd data-field="state"></dd></div>
          <div><dt>认证来源</dt><dd data-field="authSource"></dd></div>
          <div><dt>兼容性</dt><dd data-field="compatibility"></dd></div>
        </dl>
        <div class="provider-panel" data-field="providerPanel" hidden>
          <p class="section-label">PROVIDER &amp; DATA DESTINATION</p>
          <label>Provider<select data-field="providerSelect" aria-label="OpenCode Provider"></select></label>
          <label>Model<select data-field="modelSelect" aria-label="OpenCode Model"></select></label>
          <p class="data-destination">数据出口：<strong data-field="destinationHost"></strong></p>
          <p class="request-boundary" data-field="modelRequestState">模型请求尚未启动</p>
        </div>
        <div class="native-capability-panel">
          <p class="section-label">CODEX NATIVE CAPABILITIES</p>
          <ul data-field="nativeCapabilities" aria-label="Codex native capabilities"></ul>
          <p class="native-boundary-note">Runtime 专属能力；不自动提升为公共 Adapter 能力。</p>
        </div>
      </article>
    </template>
    <template id="tool-card-template">
      <article class="tool-card"><div class="card-kicker">TOOL</div><h3 data-field="title"></h3><pre data-field="summary"></pre></article>
    </template>
    <template id="permission-card-template">
      <article class="permission-card">
        <div class="card-kicker">PERMISSION REQUEST</div><h3 data-field="title"></h3><p data-field="description"></p>
        <dl>
          <div><dt>类别</dt><dd data-field="category"></dd></div>
          <div><dt>风险</dt><dd data-field="risk"></dd></div>
          <div><dt>范围</dt><dd data-field="scope"></dd></div>
          <div><dt>Enforcement Level</dt><dd data-field="enforcement"></dd></div>
        </dl>
        <div class="permission-actions"><button type="button">拒绝</button><button type="button" class="primary">允许一次</button></div>
      </article>
    </template>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
