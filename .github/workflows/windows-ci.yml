name: windows-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify checkpoints and secrets
        run: npm run check

      - name: Run credential-free contract tests
        run: |
          npm run test:contract
          npm run test:gate0
          npm run typecheck
          npm run test:host
          npm run test:ipc
          npm run test:database
          npm run test:runtime
          npm run test:permission
          npm run test:ui
          npm run test:gate1
          npm run test:project
          npm run test:worktree
          npm run test:workspace
          npm run test:git
          npm run test:gate2
          npm run test:codex
          npm run test:codex-adapter
          npm run test:windows
          npm run test:opencode
          npm run test:opencode-adapter
          npm run test:alpha
          npm run test:dual-runtime
          npm run test:gate3
          npm run test:gate4
          npm run test:recovery
          npm run test:security
          npm run test:observability
          npm run test:release
          npm run test:release-candidate
          npm run test:gate5
          npm run test:v1-ready

      - name: Build and verify Windows release candidate installer
        run: .\scripts\verify-windows-release-candidate.ps1
