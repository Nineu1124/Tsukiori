name: windows-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify checkpoints and secrets
        run: npm run check

      - name: Build workspace once
        run: npm run build

      - name: Typecheck workspace
        run: npm run typecheck

      - name: Run core contracts and snapshots
        run: node scripts/run-ci-tests.mjs core

      - name: Run Windows host and credential fixture contracts
        run: node scripts/run-ci-tests.mjs host

      - name: Run Runtime and crash contracts
        run: node scripts/run-ci-tests.mjs adapters

      - name: Run Claude Adapter contracts
        run: node scripts/run-ci-tests.mjs claude

      - name: Run workspace and Git contracts
        run: node scripts/run-ci-tests.mjs workspace

      - name: Run desktop contracts and UI probe
        run: node scripts/run-ci-tests.mjs desktop

      - name: Run release contracts
        run: node scripts/run-ci-tests.mjs release

      - name: Run Gates in dependency order
        run: node scripts/run-ci-tests.mjs gates

      - name: Build and verify Windows release candidate installer
        run: .\scripts\verify-windows-release-candidate.ps1
